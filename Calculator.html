<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Calculator</title>
    <style>
        /* --- DARK PURPLE THEME --- */
        body {
            background: linear-gradient(135deg, #050505 0%, #1a0b2e 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            color: white;
        }

        /* Glassmorphism Calculator Body */
        .calculator {
            background: rgba(255, 255, 255, 0.05);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid rgba(139, 92, 246, 0.3);
            backdrop-filter: blur(15px);
            width: 320px;
        }

        /* Display Screen */
        #display {
            width: 100%;
            height: 70px;
            background: rgba(0, 0, 0, 0.3);
            border: none;
            border-radius: 10px;
            margin-bottom: 20px;
            color: #fff;
            font-size: 2.5rem;
            text-align: right;
            padding: 15px;
            box-sizing: border-box;
            font-weight: 300;
        }

        /* Button Grid */
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            padding: 15px;
            font-size: 1.2rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            transition: 0.2s;
            font-weight: bold;
        }

        button:hover {
            background: rgba(168, 85, 247, 0.4);
            transform: scale(1.05);
        }

        button:active { transform: scale(0.95); }

        /* Special Button Colors */
        .operator { color: #d8b4fe; } /* Light Purple Text */
        
        .equal {
            background: #a855f7; /* Main Purple Accent */
            grid-column: span 2;
            width: 100%;
        }
        .equal:hover { background: #9333ea; }

        .clear {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        .clear:hover { background: rgba(239, 68, 68, 0.4); }

        /* Back Link Styling */
        .back-link {
            margin-top: 25px;
            color: #a855f7;
            text-decoration: none;
            font-size: 0.9rem;
            opacity: 0.8;
            transition: 0.3s;
        }
        .back-link:hover { opacity: 1; text-decoration: underline; }

    </style>
</head>
<body>

    <div class="calculator">
        <input type="text" id="display" readonly>
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">AC</button>
            <button onclick="deleteLast()">DEL</button>
            <button onclick="appendToDisplay('/')" class="operator">÷</button>
            <button onclick="appendToDisplay('*')" class="operator">×</button>
            
            <button onclick="appendToDisplay('7')">7</button>
            <button onclick="appendToDisplay('8')">8</button>
            <button onclick="appendToDisplay('9')">9</button>
            <button onclick="appendToDisplay('-')" class="operator">−</button>
            
            <button onclick="appendToDisplay('4')">4</button>
            <button onclick="appendToDisplay('5')">5</button>
            <button onclick="appendToDisplay('6')">6</button>
            <button onclick="appendToDisplay('+')" class="operator">+</button>
            
            <button onclick="appendToDisplay('1')">1</button>
            <button onclick="appendToDisplay('2')">2</button>
            <button onclick="appendToDisplay('3')">3</button>
            <button onclick="calculateResult()" class="equal">=</button>
            
            <button onclick="appendToDisplay('0')" style="grid-column: span 2; width:100%">0</button>
            <button onclick="appendToDisplay('.')">.</button>
        </div>
    </div>

    <a href="file:///C:/Users/ALSP/Desktop/HTML/portfolio.html" class="back-link">← Back to Portfolio</a>

    <script>
        const display = document.getElementById('display');

        function appendToDisplay(input) {
            display.value += input;
        }

        function clearDisplay() {
            display.value = "";
        }

        function deleteLast() {
            display.value = display.value.toString().slice(0, -1);
        }

        function calculateResult() {
            try {
                // Use eval to calculate (Safe for simple local projects)
                display.value = eval(display.value);
            } catch (error) {
                display.value = "Error";
                setTimeout(() => clearDisplay(), 1000);
            }
        }
        
        // Optional: Allow keyboard input
        document.addEventListener('keydown', function(event) {
            const key = event.key;
            if (!isNaN(key) || ['+', '-', '*', '/', '.'].includes(key)) {
                appendToDisplay(key);
            } else if (key === 'Enter') {
                calculateResult();
            } else if (key === 'Backspace') {
                deleteLast();
            } else if (key === 'Escape') {
                clearDisplay();
            }
        });
    </script>
</body>
</html>
